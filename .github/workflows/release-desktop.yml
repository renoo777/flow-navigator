# 桌面安装包跨平台构建：推 tag（v*）时触发
# 产物以 Draft Release 形式挂到仓库 Releases 页 —— 确认无误后点 Publish 即对外发布。
name: Release Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest # Windows: NSIS 安装器 + MSI
            args: ''
          - platform: macos-latest # Apple Silicon (M 系列)
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel Mac
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04 # Linux: deb / AppImage / rpm
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust 增量缓存：二次构建从 ~10 分钟降到 ~3 分钟
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies (webkit2gtk 等)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名私钥（v0.1.4 自动更新）：在仓库 Settings → Secrets 里配置，
          # 值 = 私钥文件内容 与 生成时的密码（本机 ~/.tauri/flow-navigator.key）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Flow Navigator v__VERSION__'
          releaseBody: '桌面安装包：Windows（exe/msi）· macOS（dmg，Intel 与 Apple Silicon）· Linux（deb/AppImage）。下载对应平台安装包即可，数据保存在本机。'
          releaseDraft: true
          prerelease: false
          # 自动更新：把 latest.json（各平台签名+下载地址清单）作为 Release 资产上传，
          # 已装用户启动时即读取它检查更新。preferNsis 保证 Windows 更新走 NSIS（MSI 不支持自更新）
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # 国内镜像版自动更新清单：把 latest.json 里各平台的下载地址统一加 gh-proxy 前缀，
  # 另存为 latest-mirror.json 上传。tauri.conf.json 的第二个 endpoint 指向它 ——
  # 官方 endpoint 因「网络被 reset」失败时，用户至少还有一条能走通的路。
  # 注：Tauri 只在非 2XX 时才回退下一个 endpoint，所以本 job 只是兜底之一，不是万能药。
  updater-mirror:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # 镜像清单失败不影响安装包与官方 latest.json
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 latest-mirror.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*) ;; *) TAG="v$(node -p "require('./package.json').version")" ;; esac
          echo "tag = $TAG"
          gh release download "$TAG" -R renoo777/flow-navigator -p latest.json -O latest.json
          python3 - <<'PY'
          import json
          P = 'https://gh-proxy.com/'
          d = json.load(open('latest.json', encoding='utf-8'))
          for v in d.get('platforms', {}).values():
              u = v.get('url', '')
              if u.startswith('http'):
                  v['url'] = P + u
          json.dump(d, open('latest-mirror.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('mirrored:', [v['url'] for v in d.get('platforms', {}).values()])
          PY
          gh release upload "$TAG" latest-mirror.json -R renoo777/flow-navigator --clobber
