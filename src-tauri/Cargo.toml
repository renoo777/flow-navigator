[package]
name = "flow-navigator"
version = "0.1.0"
description = "变量导航器 · 复杂流程图变量拆解工具"
edition = "2021"
rust-version = "1.77.2"

# 库名必须以下划线分隔（Rust crate 命名规范），会在 main.rs 中被引用
[lib]
name = "flow_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# v0.1.4：引入 updater/process/dialog 三插件（自动更新）；serde_json 为 generate_context! 宏解析
# tauri.conf.json 的 plugins 段所需（无 plugins 段时宏不引用，故此前版本未显式依赖）
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
